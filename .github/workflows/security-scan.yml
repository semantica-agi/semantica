name: Security Scan

on:
  schedule:
    # Daily, so a newly published advisory against a pinned dependency
    # fails here on main first, instead of surfacing as a failure on
    # whichever PR happens to run next.
    - cron: '30 1 * * *'  # Daily 7 AM IST
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '**/*.md'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Detect whether this PR touches any source files (non-docs/non-markdown).
  # The result drives the `security-scan` job's `if:` condition so that:
  #   - docs-only PRs: `security-scan` is skipped (satisfies the required check).
  #   - code PRs:      the full scan runs exactly as before.
  # Schedule and workflow_dispatch runs always skip this job and run the scan
  # unconditionally (the security-scan job's if: accounts for that below).
  # Push events (to main) keep their own paths-ignore above.
  changes:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      src: ${{ steps.filter.outputs.src }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check for source changes
        id: filter
        run: |
          # List files changed in this PR relative to the true merge base.
          # Using three-dot merge-base diff so changes on the base branch that
          # are not part of this PR do not appear in the file list.
          # If every changed file matches the docs/markdown paths-ignore list
          # (at any directory depth), this is a docs-only PR and src=false;
          # otherwise src=true.
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MERGE_BASE=$(git merge-base "$BASE" "$HEAD")
          CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD")
          echo "Changed files:"
          echo "$CHANGED"
          NON_DOCS=$(echo "$CHANGED" | grep -Ev '^(docs/|mkdocs\.yml$|requirements-docs\.txt$|.*\.md$)' || true)
          if [ -n "$NON_DOCS" ]; then
            echo "src=true" >> "$GITHUB_OUTPUT"
          else
            echo "src=false" >> "$GITHUB_OUTPUT"
          fi

  security-scan:
    # For pull_request events:
    #   - skip only when changes ran successfully and explicitly set src=false
    #     (i.e. a confirmed docs-only PR).
    #   - run when changes succeeded with src=true (source changes present).
    #   - run when changes failed or was cancelled (fail-closed: missing output
    #     must not silently skip the security scan).
    # For schedule/workflow_dispatch/push: changes is skipped; always() ensures
    # the scan still runs unconditionally for those triggers.
    needs: [changes]
    if: >-
      always() && (
        github.event_name != 'pull_request' ||
        needs.changes.result != 'success' ||
        needs.changes.outputs.src == 'true'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
      # Needed for the "Comment PR with Security Results" step below. Safe on
      # pull_request (not pull_request_target): GitHub always forces a
      # read-only token for PRs from forks regardless of this permission.
      pull-requests: write
    # For the report-scheduled-result job, which cannot read this job's
    # $GITHUB_ENV.
    outputs:
      ignored_vuln_ids: ${{ steps.pip_audit.outputs.ignored_vuln_ids }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
        
      - name: Install dependencies
        run: |
          pip install -r .github/requirements/bootstrap.txt --require-hashes
          # Install the pinned dependency set FIRST so pip-audit scans
          # Semantica's exact CI/release dependency tree (requirements-ci.txt
          # is generated from pyproject.toml extras, so this covers the
          # project's real deps).
          pip install -r requirements-ci.txt --require-hashes
          # Tooling AFTER the pinned set: installing it first would let the
          # pinned requirements overwrite the tooling's own transitive deps.
          pip install -r .github/requirements/pip-audit.txt --require-hashes
          # --no-deps: security-scan-tools.txt overrides semgrep's pyjwt pin
          # (see security-scan-tools-overrides.txt), which pip's resolver would
          # otherwise reject. The file already hash-pins every transitive dep.
          pip install -r .github/requirements/security-scan-tools.txt --require-hashes --no-deps

      - name: Run pip-audit (Package Vulnerabilities)
        id: pip_audit
        continue-on-error: true
        run: |
          # Keep publishing reports and the PR comment even when the audit
          # gate fails. The final gate below preserves the failure status.
          echo 'AUDIT_SCAN_STATUS=failed' >> "$GITHUB_ENV"

          # Same dependency tree Safety used to scan, and the same tool and
          # invocation already proven reliable in security.yml.
          #
          # CI installs TWO locked dependency graphs, so both are audited:
          # requirements-ci.txt (generated from the `all` extra) and
          # .github/requirements/open-ontologies-extra.txt, which ci.yml
          # installs and imports to run the Open Ontologies integration
          # tests. The open-ontologies extra is deliberately kept out of
          # `all`, so requirements-ci.txt does not carry it: auditing only
          # that file would leave a disclosed vulnerability in
          # open-ontologies-lite, or in any package unique to its
          # resolution, unable to fail this gate.
          pip-audit -r requirements-ci.txt --format=json --output=pip-audit-base.json || true
          pip-audit -r .github/requirements/open-ontologies-extra.txt --format=json --output=pip-audit-open-ontologies.json || true

          # Guard 1: fail loudly if pip-audit exited before writing a report
          # at all (network error, tool crash). Without this check a missing
          # or empty file causes jq to fall back to "0", making a broken
          # scanner indistinguishable from a clean scan. Applied to each raw
          # report, so one silently failing audit cannot be hidden by the
          # other one succeeding.
          for raw_report in pip-audit-base.json pip-audit-open-ontologies.json; do
            if [ ! -s "$raw_report" ]; then
              echo "::error::pip-audit produced no report ($raw_report is missing or empty). Treating as failure — check for network errors or pip-audit crashes in the logs above."
              exit 1
            fi
          done

          # Merge into the single pip-audit-report.json that every step below
          # reads, so the validation, allowlist, counting, reporting and
          # artifact-upload logic stays exactly as it was.
          #
          # Both graphs resolve against the same constraint file and so share
          # most of their packages. Entries are deduplicated on
          # (lowercased name, version) and their vulns unioned by id —
          # without that, one finding in a shared package would be counted
          # twice by the gate and listed twice in the PR comment. An entry
          # that pip-audit could audit (it carries a vulns array) is
          # preferred over the same package reported with a skip_reason, so
          # merging never downgrades a real result to an unaudited one.
          # `.[0] + {...}` keeps any other top-level keys pip-audit emits.
          jq -s '
            .[0] + {dependencies: (
              [.[].dependencies[]]
              # A space cannot occur in a PEP 508 name or a version, so it
              # is a safe key separator; a \u0000 escape would depend on how
              # the jq build handles a NUL inside a string.
              | group_by(((.name // "") | ascii_downcase) + " " + (.version // ""))
              | map(
                  (((map(select(has("vulns"))) | first) // .[0])) as $base
                  | if ($base | has("vulns"))
                    then $base + {vulns: ([.[].vulns // []] | add | unique_by(.id))}
                    else $base
                    end
                )
            )}
          ' pip-audit-base.json pip-audit-open-ontologies.json > pip-audit-report.json

          # Guard 1b: a jq failure above leaves an empty file, which would
          # read as a clean scan to everything below.
          if [ ! -s pip-audit-report.json ]; then
            echo "::error::Merging the pip-audit reports produced no output (pip-audit-report.json is missing or empty). Treating as failure — check the jq invocation above."
            exit 1
          fi

          # Guard 2: fail closed when the report doesn't have the shape the
          # checks below assume: a non-empty dependencies array, each entry
          # either carrying an array-valued vulns field or being a dependency
          # pip-audit couldn't resolve/audit, which it reports as
          # {"name": ..., "skip_reason": ...} with no vulns field at all
          # (see pip_audit._format.json.JsonFormat._format_dep). That's a
          # normal, documented report shape, not a malformed one — treating
          # it as invalid would fail the whole job over a single unauditable
          # package, the same kind of scan-unrelated CI break this migration
          # away from Safety was meant to fix.
          if ! jq -e '
            (.dependencies | type == "array" and length > 0)
            and all(.dependencies[]; type == "object" and ((.vulns | type == "array") or (.skip_reason | type == "string")))
          ' pip-audit-report.json >/dev/null 2>&1; then
            echo "::error::pip-audit report has an invalid dependency structure. Expected a non-empty dependencies array where every entry has either a vulns array or a skip_reason. Treating as failure."
            exit 1
          fi

          echo "Checking for package vulnerabilities..."

          # Guard 2 above already confirmed pip-audit-report.json is valid
          # JSON with a well-shaped dependencies array, so this count is
          # always a plain non-negative integer.
          SKIPPED=$(jq '[.dependencies[] | select(has("skip_reason"))] | length' pip-audit-report.json)
          if [ "$SKIPPED" -gt 0 ]; then
            echo "⚠️ pip-audit could not audit $SKIPPED dependencies (see pip-audit-report.json for skip_reason):"
            jq -r '.dependencies[] | select(has("skip_reason")) | "  - \(.name): \(.skip_reason)"' pip-audit-report.json
          fi

          # Clearing an advisory: bump the package to the latest release with
          # no known advisories, not to the first fixed version. #1924 moved
          # docling only to 2.131.0, the first release fixing one advisory,
          # and three more advisories against <2.132.0 failed every PR a day
          # later. Ignoring an ID below is for findings that are reviewed
          # and genuinely non-actionable, never a way to get CI green.
          #
          # Vulnerability IDs accepted for this project. Comma-separated; give
          # each entry a comment here saying what it covers and when to
          # re-evaluate it.
          #   NOTE: pip-audit's OSV-backed report may surface either identifier as
          #   the primary `id` (with the other listed under `aliases`) depending on
          #   which alias the backing database picks as canonical, so list both
          #   the GHSA and the CVE id of an advisory here; the matching below
          #   checks aliases too - see
          #   https://github.com/semantica-agi/semantica/actions/runs/34296586683
          #   where this ignore list had only the GHSA id but the report's `id`
          #   was the CVE, so the gate still failed.
          # - opentelemetry-api 1.43.0, GHSA-xcq7-p3pf-p88h / CVE-2026-114603:
          #   TraceState.from_header parses an inbound W3C tracestate header in
          #   O(N^2) time. Fixed in 1.45.1, but every google-adk release
          #   (latest 2.12.0) caps opentelemetry-api<=1.43, so no fix is
          #   installable. Semantica never imports opentelemetry and its
          #   google-adk integration runs no HTTP server, so nothing here
          #   extracts trace context from inbound headers. Re-evaluate when
          #   google-adk allows 1.45.1; the acceptance expires on 2027-01-23,
          #   the same date as the ignoreUntil in osv-scanner.toml.
          IGNORED_VULN_IDS=""
          if [ "$(date -u +%Y%m%d)" -lt 20270123 ]; then
            IGNORED_VULN_IDS="GHSA-xcq7-p3pf-p88h,CVE-2026-114603"
          else
            echo "::warning::The opentelemetry-api GHSA-xcq7-p3pf-p88h acceptance expired on 2027-01-23 and that finding now fails the scan."
          fi

          # Exported so the "Comment PR with Security Results" step below can
          # apply the same exclusion list to the raw report - it reads
          # pip-audit-report.json independently in JS, so without this the PR
          # comment would show an accepted finding as live even though this
          # gate correctly treats it as non-actionable.
          echo "IGNORED_VULN_IDS=$IGNORED_VULN_IDS" >> "$GITHUB_ENV"
          # Also a step output for the report-scheduled-result job, since
          # $GITHUB_ENV does not cross jobs. Written before any `exit 1` below
          # so it is set even when the audit fails.
          echo "ignored_vuln_ids=$IGNORED_VULN_IDS" >> "$GITHUB_OUTPUT"

          # No []? / || echo "0" fallback: if jq fails (malformed JSON) VULNS
          # will be empty or "null" so Guard 3 below catches it rather than
          # silently treating the broken report as zero.
          # `.vulns // []` guards against skipped dependencies, which carry
          # no vulns field at all (see the skip_reason handling above) -
          # without the fallback, iterating `null[]` raises inside jq and
          # this whole computation silently evaluates to empty.
          #
          # Matching checks `.id` AND `.aliases` (pip-audit includes aliases by
          # default for JSON output): the OSV-backed report can surface either
          # the GHSA or the CVE identifier as the canonical `id` for the same
          # advisory, with the other one demoted to an alias, so matching on
          # `.id` alone is not reliable.
          VULNS=$(jq --arg ignored "$IGNORED_VULN_IDS" '
            ($ignored | split(",") | map(select(length > 0))) as $ignore_list
            | [.dependencies[] | (.vulns // [])[]
               | select(([.id] + (.aliases // [])) as $ids | ($ids - $ignore_list | length) == ($ids | length))]
            | length
          ' pip-audit-report.json 2>/dev/null)

          # Guard 3: ensure VULNS is a non-negative integer before the -gt
          # comparison. "null" (missing/null key) or "" (jq parse failure) would
          # cause bash's -gt to throw an arithmetic error and fall through to the
          # success branch — the same silent-pass bug as a missing file.
          if ! [[ "$VULNS" =~ ^[0-9]+$ ]]; then
            echo "::error::pip-audit report exists but dependency vulnerabilities are missing or non-numeric (got: '${VULNS}'). The report may be malformed or contain an error-only JSON response. Treating as failure."
            exit 1
          fi

          if [ "$VULNS" -gt 0 ]; then
            echo "❌ Security vulnerabilities found: $VULNS"
            echo "CI will fail to prevent merging of vulnerable dependencies"
            echo ""
            echo "Vulnerability details:"
            jq --arg ignored "$IGNORED_VULN_IDS" -r '
              ($ignored | split(",") | map(select(length > 0))) as $ignore_list
              | .dependencies[] as $dependency
              | ($dependency.vulns // [])[]
              | select(([.id] + (.aliases // [])) as $ids | ($ids - $ignore_list | length) == ($ids | length))
              | "- \($dependency.name)==\($dependency.version): \(.id)"
            ' pip-audit-report.json || true
            exit 1
          else
            echo "✅ No actionable security vulnerabilities found${IGNORED_VULN_IDS:+ (ignored: $IGNORED_VULN_IDS)}"
            echo 'AUDIT_SCAN_STATUS=passed' >> "$GITHUB_ENV"
          fi

      - name: Run Bandit (Code Security Linter)
        run: |
          bandit -r semantica/ -f json -o bandit-report.json || true
          echo "Checking for HIGH severity security issues..."
          
          # Count HIGH severity issues
          HIGH_ISSUES=$(bandit -r semantica/ -f json -ll 2>/dev/null | jq -r '.results[]? | select(.issue_severity == "HIGH") | .test_name' 2>/dev/null | wc -l || echo "0")
          
          if [ "$HIGH_ISSUES" -gt 0 ]; then
            echo "❌ HIGH severity security issues found: $HIGH_ISSUES"
            echo "CI will fail to prevent merging of high-risk code"
            echo ""
            echo "High severity issues:"
            bandit -r semantica/ -ll | grep "Severity: High" -A 5 -B 1 || true
            exit 1
          else
            echo "✅ No HIGH severity security issues found"
          fi
        
      - name: Run Semgrep (Static Analysis)
        run: |
          echo "Running Semgrep static analysis..."
          semgrep --config=auto --json --output=semgrep-report.json semantica/ || true
          
          # Run security-focused rules
          echo "Checking for security patterns..."
          SECURITY_ISSUES=$(semgrep --config=p/security --json semantica/ 2>/dev/null | jq '.results | length' 2>/dev/null || echo "0")
          
          if [ "$SECURITY_ISSUES" -gt 0 ]; then
            echo "⚠️ Security patterns found: $SECURITY_ISSUES"
            echo "Review these findings for potential improvements"
            semgrep --config=p/security semantica/ || true
          else
            echo "✅ No security patterns found"
          fi
        
      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          retention-days: 14
          path: |
            pip-audit-report.json
            bandit-report.json
            semgrep-report.json
        
      - name: Comment PR with Security Results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');

            // Renders one tool's findings as a section. `items` is already
            // the list of pre-formatted "- `thing` in `where`" strings; this
            // just handles the found/not-found/report-missing framing and
            // collapses long lists into a <details> block so the comment
            // doesn't turn into a wall of text.
            function renderSection(title, reportPath, parse) {
              let data;
              try {
                data = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              } catch (e) {
                return [
                  `### ${title}`,
                  `⚠️ No report found at \`${reportPath}\` — the scan may have failed before producing output. Check the job logs.`,
                ].join('\n');
              }

              const items = parse(data);
              if (items === null) {
                return [
                  '### ' + title,
                  '⚠️ Invalid report structure in ' + reportPath + ' — check the job logs.',
                ].join('\n');
              }
              if (items.length === 0) {
                return [`### ${title}`, `✅ No findings.`].join('\n');
              }

              const lines = [`### ${title}`, `Found **${items.length}**.`, ''];
              const shown = items.slice(0, 15);
              if (items.length > 15) {
                lines.push('<details>', '<summary>Show all findings</summary>', '');
                lines.push(...items);
                lines.push('', '</details>');
              } else {
                lines.push(...shown);
              }
              return lines.join('\n');
            }

            // Mirrors the shell step's own IGNORED_VULN_IDS (passed through
            // $GITHUB_ENV) so an accepted, non-actionable CVE that the CI
            // gate already excluded doesn't reappear here as a live finding -
            // this reads the same raw, unfiltered pip-audit-report.json.
            const ignoredVulnIds = (process.env.IGNORED_VULN_IDS || '')
              .split(',')
              .map((id) => id.trim())
              .filter(Boolean);

            // A dependency pip-audit couldn't resolve/audit is reported as
            // {"name": ..., "skip_reason": ...} with no vulns field at all
            // (see pip_audit._format.json.JsonFormat._format_dep) - that's a
            // normal report shape, not a malformed one, so it must not be
            // treated as an invalid dependency below.
            const isSkipped = (dependency) => typeof dependency.skip_reason === 'string';

            let skippedDeps = [];
            try {
              const auditData = JSON.parse(fs.readFileSync('pip-audit-report.json', 'utf8'));
              skippedDeps = (auditData.dependencies || []).filter(
                (dependency) => dependency && typeof dependency === 'object' && isSkipped(dependency)
              );
            } catch (e) {
              // Unreadable/unparseable report - renderSection's own
              // report-missing branch below surfaces this.
            }

            const pipAuditSection = renderSection(
              'pip-audit — dependency vulnerabilities',
              'pip-audit-report.json',
              (data) => {
                if (
                  !Array.isArray(data.dependencies) ||
                  data.dependencies.length === 0 ||
                  data.dependencies.some(
                    (dependency) =>
                      !dependency ||
                      typeof dependency !== 'object' ||
                      (!Array.isArray(dependency.vulns) && !isSkipped(dependency))
                  )
                ) {
                  return null;
                }

                // A vuln's canonical `id` and its `aliases` (e.g. GHSA vs. CVE
                // for the same advisory) are checked together - mirrors the
                // shell gate above, which needs the same fallback because
                // pip-audit's OSV-backed report doesn't consistently pick the
                // same identifier as canonical across advisories.
                return data.dependencies.flatMap((dependency) =>
                  (dependency.vulns || [])
                    .filter((vulnerability) =>
                      ![vulnerability.id, ...(vulnerability.aliases || [])].some((id) => ignoredVulnIds.includes(id))
                    )
                    .map(
                      (vulnerability) => `- \`${dependency.name}==${dependency.version}\`: ${vulnerability.id}` +
                        (vulnerability.fix_versions?.length ? ` (fixed by ${vulnerability.fix_versions.join(', ')})` : '')
                    )
                );
              }
            ) + (ignoredVulnIds.length
              ? `\n\n_Excluded as accepted, non-actionable findings: ${ignoredVulnIds.join(', ')} — see the workflow file's inline comments for why._`
              : '') + (skippedDeps.length
              ? `\n\n_Could not be audited: ${skippedDeps.map((d) => `\`${d.name}\` (${d.skip_reason})`).join(', ')}_`
              : '');

            const banditSection = renderSection(
              'Bandit — HIGH-severity code issues',
              'bandit-report.json',
              (data) => (data.results || [])
                .filter((issue) => issue.issue_severity === 'HIGH')
                .map((issue) => `- \`${issue.test_name}\` in \`${issue.filename}:${issue.line_number}\``)
            );

            const semgrepSection = renderSection(
              'Semgrep — static analysis patterns',
              'semgrep-report.json',
              (data) => (data.results || []).map(
                (issue) => `- \`${issue.check_id}\` in \`${issue.path}:${issue.start?.line ?? '?'}\``
              )
            );

            const comment = [
              '# 🔒 Security Scan Results',
              '',
              pipAuditSection,
              '',
              banditSection,
              '',
              semgrepSection,
              '',
              '---',
              '',
              '*This security scan runs automatically on source-code PRs and daily (skipped for doc/markdown-only changes).*',
              '',
              '📊 **Security Policy**: CI fails on pip-audit vulnerabilities and Bandit HIGH-severity findings. Semgrep findings above are informational and do not block merge.',
            ].join('\n');

            try {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment,
              });
              console.log('✅ Security comment posted successfully');
            } catch (error) {
              console.log('⚠️ Could not post security comment:', error.message);
              console.log('📋 Security scan results saved to artifacts');
            }

      - name: Enforce Audit Gate
        if: always()
        run: |
          if [ "${AUDIT_SCAN_STATUS:-failed}" != "passed" ]; then
            echo "::error::pip-audit scan failed. See the pip-audit output and uploaded reports above."
            exit 1
          fi

  # Scheduled runs have no PR to comment on, so without this a failure on
  # main is only visible to whoever opens the Actions tab. A separate job
  # rather than a step in security-scan, because:
  #   - only this job holds `issues: write`; the scan job installs
  #     PR-controlled dependencies on pull_request runs.
  #   - a cancelled or timed-out scan job never reaches its later steps, but
  #     this job still runs after it.
  report-scheduled-result:
    needs: [security-scan]
    # always(), not failure(): failure() is false for cancelled runs, and a
    # successful run is needed too, to close the tracking issue. The script
    # acts on needs.security-scan.result.
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    # No contents: read; this job never checks out the repository.
    permissions:
      # Create the label, and open, comment on and close the tracking issue.
      issues: write
      # List this run's jobs and steps, to name the failed steps in the issue.
      actions: read
    steps:
      # continue-on-error: a run cancelled before the upload step has no
      # artifact; the script below then reports the audit report as missing.
      - name: Download security reports
        if: needs.security-scan.result != 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-reports
          path: security-reports

      - name: Report scheduled result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SCAN_RESULT: ${{ needs.security-scan.result }}
          IGNORED_VULN_IDS: ${{ needs.security-scan.outputs.ignored_vuln_ids }}
        with:
          script: |
            const fs = require('fs');

            // One tracking issue, found by this label, collects every
            // scheduled failure until the scan passes again. Later failures
            // add a comment instead of opening duplicates.
            const label = 'security-scan-failure';
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const scanResult = process.env.SCAN_RESULT;

            // Open tracking issues, oldest first. PRs share the issues API
            // and can carry the label, so they are excluded. Listing by a
            // label that does not exist yet returns an empty list.
            const listOpen = async () =>
              (await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', labels: label,
              }))
                .filter((issue) => !issue.pull_request)
                .sort((a, b) => a.number - b.number);

            // A re-run keeps the original event and commit, so re-running an
            // older scheduled run must not close or open the tracking issue
            // for a newer one. Only the latest scheduled run acts on it.
            const { data: thisRun } = await github.rest.actions.getWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            const { data: { workflow_runs: [latest] } } = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id: thisRun.workflow_id, event: 'schedule', per_page: 1,
            });
            if (latest && latest.run_number > thisRun.run_number) {
              console.log(`Newer scheduled run #${latest.run_number} (${latest.html_url}) supersedes this one (#${thisRun.run_number}); leaving the tracking issue unchanged.`);
              return;
            }

            // The scan recovered: close every open tracking issue.
            if (scanResult === 'success') {
              const open = await listOpen();
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Scheduled Security Scan passed again on \`${context.ref}\` at \`${context.sha.slice(0, 7)}\`: ${runUrl}. Closing.`,
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed',
                });
                console.log(`Closed #${issue.number} (scan recovered)`);
              }
              if (!open.length) console.log('Scan passed; no open tracking issue to close.');
              return;
            }

            // Same exclusion list the gate applied, so the issue lists
            // exactly what failed the gate.
            const ignoredVulnIds = (process.env.IGNORED_VULN_IDS || '')
              .split(',')
              .map((id) => id.trim())
              .filter(Boolean);

            // Escapes a value for a markdown table cell: `|` would end the
            // cell, a backtick would open a code span, and a row must stay on
            // one line.
            const cell = (value) => String(value ?? '')
              .replace(/[\r\n]+/g, ' ')
              .replace(/\|/g, '\\|')
              .replace(/`/g, '\\`');

            // 'missing' (no file), 'invalid' (unparseable, or not the shape
            // the gate's Guard 2 accepts) or 'valid'. Only a valid report may
            // be summarised as having no actionable vulnerabilities.
            let reportState = 'valid';
            let findings = [];
            let report;
            try {
              report = JSON.parse(fs.readFileSync('security-reports/pip-audit-report.json', 'utf8'));
            } catch (e) {
              reportState = e.code === 'ENOENT' ? 'missing' : 'invalid';
            }
            if (reportState === 'valid') {
              const dependencies = report && report.dependencies;
              const wellFormed = Array.isArray(dependencies) && dependencies.length > 0 &&
                dependencies.every((dependency) =>
                  dependency && typeof dependency === 'object' &&
                  (Array.isArray(dependency.vulns) || typeof dependency.skip_reason === 'string')
                );
              if (!wellFormed) reportState = 'invalid';
            }
            if (reportState === 'valid') {
              findings = report.dependencies.flatMap((dependency) =>
                (dependency.vulns || [])
                  .filter((vulnerability) =>
                    ![vulnerability.id, ...(vulnerability.aliases || [])].some((id) => ignoredVulnIds.includes(id))
                  )
                  .map((vulnerability) => {
                    const aliases = (vulnerability.aliases || []).join(', ');
                    const fixes = (vulnerability.fix_versions || []).join(', ');
                    // Plain text, not a code span: a backtick inside a code
                    // span cannot be escaped.
                    return `| ${cell(dependency.name)} | ${cell(dependency.version)} | ${cell(vulnerability.id)} | ${cell(aliases) || '—'} | ${cell(fixes) || 'none yet'} |`;
                  })
              );
            }

            // The failure may not come from pip-audit at all (Bandit, a
            // dependency install, a missing report), so name the failed steps
            // too: a scheduled failure must never go unreported.
            let failedSteps = [];
            try {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                owner, repo, run_id: context.runId,
              });
              failedSteps = jobs.flatMap((job) =>
                (job.steps || [])
                  // Cancelled steps show where a cancelled or timed-out run
                  // stopped.
                  .filter((step) => step.conclusion === 'failure' || step.conclusion === 'cancelled')
                  .map((step) => `${job.name} / ${step.name} (${step.conclusion})`)
              );
            } catch (e) {
              console.log('Could not list failed steps:', e.message);
            }

            // GitHub rejects an issue or comment body over 65,536 characters,
            // and then no issue is opened at all. .length counts UTF-16 code
            // units, never fewer than characters, so capping on it is safe.
            const MAX_BODY = 65536;

            // `rows` are the findings shown, `omitted` how many were cut to
            // fit MAX_BODY.
            const buildBody = (rows, omitted) => {
              let vulnSection;
              if (reportState === 'missing') {
                vulnSection = '⚠️ `pip-audit-report.json` is missing — the audit did not complete. Check the run logs.';
              } else if (reportState === 'invalid') {
                vulnSection = '⚠️ pip-audit report was empty or invalid — the audit result cannot be trusted. Check the run logs.';
              } else if (rows.length === 0 && omitted === 0) {
                vulnSection = 'pip-audit reported no actionable vulnerabilities; the failure is in another step (see above).';
              } else {
                vulnSection = [
                  '| Package | Version | ID | Aliases | First fixed |',
                  '|---|---|---|---|---|',
                  ...rows,
                ].join('\n') + (omitted
                  ? `\n\n_${omitted} more finding(s) not shown, to keep this under GitHub's 65,536-character limit. The full list is in the \`security-reports\` artifact of the run linked above._`
                  : '');
              }

              return [
                `Scheduled Security Scan ${scanResult === 'failure' ? 'failed' : `did not complete (result: \`${scanResult}\`)`} on \`${context.ref}\` at \`${context.sha.slice(0, 7)}\`: ${runUrl}`,
                '',
                '**Failed steps:** ' + (failedSteps.length ? failedSteps.map((s) => `\`${s}\``).join(', ') : 'unknown (see run)'),
                '',
                '### Vulnerable dependencies',
                vulnSection,
                '',
                'When clearing an advisory, bump to the latest release with no known advisories, not the first fixed version — see the note above `IGNORED_VULN_IDS` in `.github/workflows/security-scan.yml`.',
              ].join('\n');
            };

            let body = buildBody(findings, 0);
            if (body.length > MAX_BODY) {
              // Start from the body with no rows (it already carries the
              // "not shown" note) and add rows while they fit. The note only
              // gets shorter as rows are added. +1 is the joining newline.
              let used = buildBody([], findings.length).length;
              let shown = 0;
              while (shown < findings.length && used + findings[shown].length + 1 <= MAX_BODY) {
                used += findings[shown].length + 1;
                shown++;
              }
              body = buildBody(findings.slice(0, shown), findings.length - shown);
            }
            // Last resort, e.g. for a very long failed-steps list.
            if (body.length > MAX_BODY) body = body.slice(0, MAX_BODY);

            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205' });
            } catch (e) {
              // 422: the label already exists. Anything else is rethrown:
              // the tracking issue is found by this label, so nothing below
              // works without it.
              if (e.status !== 422) throw e;
            }

            const [existing] = await listOpen();

            let postedTo;
            if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number, body,
              });
              postedTo = existing.number;
              console.log(`Updated #${existing.number}`);
            } else {
              const { data: created } = await github.rest.issues.create({
                owner, repo,
                title: 'Scheduled Security Scan is failing on main',
                labels: [label],
                body,
              });
              postedTo = created.number;
              console.log(`Opened #${created.number}`);
            }

            // Two runs that both found no issue can each open one. Keep
            // the lowest-numbered issue and close the rest, so every run
            // converges on the same tracking issue. Runs every time, so
            // duplicates left by earlier runs are closed too.
            const [keep, ...duplicates] = await listOpen();
            if (keep && keep.number !== postedTo) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: keep.number, body,
              });
              console.log(`Moved this run's report to #${keep.number}`);
            }
            for (const duplicate of duplicates) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: duplicate.number,
                body: `Duplicate of #${keep.number}. Closing; scheduled scan failures are tracked there.`,
              });
              await github.rest.issues.update({
                owner, repo, issue_number: duplicate.number,
                state: 'closed', state_reason: 'not_planned',
              });
              console.log(`Closed duplicate #${duplicate.number}`);
            }
