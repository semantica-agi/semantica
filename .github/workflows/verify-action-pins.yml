name: Verify Action Pins

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.github/scripts/verify-action-pins.sh'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/scripts/verify-action-pins.sh'
  schedule:
    # Weekly, in case an upstream tag is deliberately moved. Monday 12:00 UTC,
    # after Dependabot's Monday 09:00 UTC github-actions run (dependabot.yml),
    # so it checks the pins after that run rather than before it.
    - cron: '0 12 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify pinned action SHAs match their tag comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/verify-action-pins.sh
