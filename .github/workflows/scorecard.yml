name: Scorecard supply-chain security

permissions: read-all

on:
  workflow_dispatch:
  branch_protection_rule:
  schedule:
    - cron: '30 1 * * 6'  # weekly
  push:
    branches: [main]

jobs:
  analysis:
    if: github.repository_owner == 'lgcorzo'
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # to upload SARIF results
      id-token: write         # to publish results and get a badge
      contents: read
      actions: read           # to detect GitHub Actions workflows

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: results.sarif
